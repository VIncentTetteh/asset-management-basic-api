# P0-7: Nginx reverse proxy for the AssetIQ public status page.
# Expects Let's Encrypt certs on the host under /etc/letsencrypt/live/status.assetiq.io/.
events { worker_connections 1024; }

http {
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Redirect all plain HTTP to HTTPS.
  server {
    listen 80 default_server;
    server_name status.assetiq.io;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name status.assetiq.io;

    ssl_certificate     /etc/letsencrypt/live/status.assetiq.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.assetiq.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Kuma uses websockets for live status updates.
    location / {
      proxy_pass         http://uptime-kuma:3001;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}

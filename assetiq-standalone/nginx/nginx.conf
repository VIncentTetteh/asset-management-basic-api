# AssetIQ Standalone — nginx reverse proxy
#
# Routing:
#   /api/v1/*   → backend:8080  (Spring Boot REST API)
#   /*          → web:3000      (Next.js static export)
#
# TLS: mount your certificate files at ./nginx/certs/
#   server.crt — full-chain certificate
#   server.key — private key
#
# For Let's Encrypt on Linux, use certbot with the --nginx plugin then
# copy the resulting certs into nginx/certs/.

worker_processes auto;
# Logs go to the container's stdout/stderr, not to files: the root filesystem is
# read-only, and `docker compose logs` is where an operator will look anyway.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  # ── Gzip ────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # Everything nginx spools must live under /tmp, which the compose file mounts
  # as tmpfs. Without these it tries /var/cache/nginx and fails read-only.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  # ── Upstream services ────────────────────────────────────────────────────────
  upstream frontend_up {
    server web:3000;
    keepalive 16;
  }

  upstream backend_up {
    server backend:8080;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
  # 8080/8443, not 80/443: this runs as an unprivileged user, which cannot bind
  # below 1024. Docker publishes them on the conventional host ports.
  server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ────────────────────────────────────────────────────────────────────
  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:\!aNULL:\!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy     "camera=(self), geolocation=(self), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

    # ── API → Spring Boot ──────────────────────────────────────────────────────
    location = /healthz {
      proxy_pass         http://backend_up/actuator/health;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Proto https;
    }

    location /api/ {
      proxy_pass         http://backend_up;
      proxy_http_version 1.1;
      proxy_set_header   Connection     "";
      proxy_set_header   Host           $host;
      proxy_set_header   X-Real-IP      $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_read_timeout 60s;
    }

    # ── Everything else → Next.js ──────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend_up;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }
}

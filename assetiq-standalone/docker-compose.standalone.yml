# AssetIQ Standalone Edition — Docker Compose
#
# Usage:
#   1. Copy .env.standalone.example to .env and fill in all values
#   2. Run: ./scripts/setup-standalone.sh
#   3. Run: docker compose -f docker-compose.standalone.yml up -d --build
#   4. Open https://<your-domain> and follow the setup wizard
#
# Services:
#   postgres       — PostgreSQL 16 application database
#   backend        — AssetIQ Backend API (Spring Boot, port 8080 internal)
#   frontend       — AssetIQ Web UI (Next.js, port 3000 internal)
#   nginx          — Reverse proxy (ports 80 + 443 public)
#
# Ports exposed to the host:
#   80  / 443 — nginx (HTTP redirects to HTTPS)
#
# Volumes:
#   postgres_data   — database files (persist between restarts)
#   uploads         — user-uploaded files served by the backend

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: assetiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [assetiq-net]

  # ── Backend API ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: assetiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_MODE: standalone
      SPRING_PROFILES_ACTIVE: prod
      ASSETIQ_LICENSE_KEY: ${ASSETIQ_LICENSE_KEY}
      # The signing service stays vendor-managed. Never ship its private key or
      # admin API into a customer-controlled environment.
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL:-https://license.assetiq.io}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assetiq
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-assetiq}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      # Flyway owns all schema changes. Hibernate must only validate in production.
      # Override only for ephemeral dev environments.
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-900000}
      APP_REFRESH_TOKEN_LIFETIME: ${APP_REFRESH_TOKEN_LIFETIME:-PT12H}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_BASE_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks: [assetiq-net, assetiq-egress]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Web Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../../Enterprise-Asset-manager-Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_MODE: standalone
        # Browser traffic must use the public same-origin nginx route. The
        # internal Docker hostname is not resolvable from customer browsers.
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: assetiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_MODE: standalone
      NEXT_PUBLIC_API_URL: /api/v1
    networks: [assetiq-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: assetiq-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro   # Mount your TLS cert + key here
    # nginx needs both networks: internal (to proxy to services) + edge (public ports)
    networks: [assetiq-net, assetiq-edge]

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  uploads:

# ── Networks ──────────────────────────────────────────────────────────────────
# assetiq-net: internal service-to-service traffic; never exposed directly.
# assetiq-egress: outbound-only bridge used by the backend for vendor license
#   validation and explicitly configured external integrations.
# assetiq-edge: nginx only — bridges the internal network to the host ports.
networks:
  assetiq-net:
    driver: bridge
    internal: true
  assetiq-egress:
    driver: bridge
  assetiq-edge:
    driver: bridge   # nginx alone sits on this network AND the host ports

# AssetIQ Standalone — Prebuilt Image Mode
#
# This is the RECOMMENDED compose file for customer installations.
# It pulls signed, tagged images from the AssetIQ container registry
# instead of building sibling source repos locally.
#
# Use this when:
#   - You are a customer deploying AssetIQ on-prem.
#   - You do NOT have the AssetIQ source tree on disk.
#   - You want reproducible, checksummed installs.
#
# Use docker-compose.standalone.yml (build mode) when:
#   - You are AssetIQ staff building from source.
#   - You have all 4 sibling repos co-located:
#       ../Enterprise-Asset-Manager/
#       ../Enterprise-Asset-manager-Frontend/
#       ../assetiq-license-server/
#       ../assetiq-customer-portal/
#
# Usage:
#   1. Copy .env.standalone.example to .env and fill in all values
#   2. Run: ./scripts/generate-rsa-keys.sh   (one-time)
#   3. Run: docker login ghcr.io   (once, with a read:packages PAT)
#   4. Run: docker compose -f docker-compose.standalone.images.yml pull
#   5. Run: docker compose -f docker-compose.standalone.images.yml up -d
#   6. Verify: ./scripts/health-check.sh
#   7. Open https://<your-domain> and follow the setup wizard

version: "3.9"

services:

  # ── Database ──────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: assetiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: assetiq,license_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetiq}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [assetiq-net]

  # ── License Server ─────────────────────────────────────────────────────────────
  license-server:
    image: ${ASSETIQ_REGISTRY:-ghcr.io/assetiq}/assetiq-license-server:${ASSETIQ_VERSION:-latest}
    container_name: assetiq-license-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/license_server
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-assetiq}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      LICENSE_RSA_PRIVATE_KEY_PATH: /app/keys/private.pem
      LICENSE_RSA_PUBLIC_KEY_PATH: /app/keys/public.pem
      LICENSE_ADMIN_API_KEY: ${LICENSE_ADMIN_API_KEY}
      LICENSE_RATE_LIMIT_RPM: ${LICENSE_RATE_LIMIT_RPM:-30}
      LICENSE_ABUSE_MAX_FINGERPRINTS: ${LICENSE_ABUSE_MAX_FINGERPRINTS:-3}
    volumes:
      - license_keys:/app/keys:ro
    networks: [assetiq-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Backend API ────────────────────────────────────────────────────────────────
  backend:
    image: ${ASSETIQ_REGISTRY:-ghcr.io/assetiq}/assetiq-backend:${ASSETIQ_VERSION:-latest}
    container_name: assetiq-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      license-server:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      APP_MODE: standalone
      SPRING_PROFILES_ACTIVE: prod
      ASSETIQ_LICENSE_KEY: ${ASSETIQ_LICENSE_KEY}
      LICENSE_SERVER_URL: http://license-server:8090
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/assetiq
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-assetiq}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      APP_BILLING_DEFAULT_CURRENCY: ${APP_BILLING_DEFAULT_CURRENCY:-GHS}
      APP_BILLING_PAYSTACK_CHANNELS: ${APP_BILLING_PAYSTACK_CHANNELS:-card,mobile_money,bank,ussd}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_BASE_DIR: /app/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://localhost}
    volumes:
      - uploads:/app/uploads
    networks: [assetiq-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Web Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: ${ASSETIQ_REGISTRY:-ghcr.io/assetiq}/assetiq-frontend:${ASSETIQ_VERSION:-latest}
    container_name: assetiq-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_APP_MODE: standalone
      NEXT_PUBLIC_API_URL: http://backend:8080
      NEXT_PUBLIC_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
    networks: [assetiq-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: assetiq-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks: [assetiq-net, assetiq-edge]

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  license_keys:
  uploads:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  assetiq-net:
    driver: bridge
    internal: true
  assetiq-edge:
    driver: bridge

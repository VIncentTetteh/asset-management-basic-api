# AssetIQ self-hosted — production compose.
#
# This is the canonical self-hosted distribution. It pulls published, immutably
# tagged images; nothing is built on the operator's machine.
#
#   1. ./scripts/bootstrap.sh          # generates .env with fresh secrets (0600)
#   2. docker compose pull
#   3. docker compose up -d
#   4. ./scripts/health-check.sh
#
# To build from source instead (AssetIQ staff, or an operator with the two repos
# checked out side by side), use docker-compose.build.yml, which overrides the
# `image:` keys below with `build:` contexts:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Every service runs as a non-root user with a read-only root filesystem. The
# only writable paths are the named volumes and the tmpfs mounts declared per
# service; anything a process needs to write that is not listed here is a bug,
# not a reason to relax read_only.

name: assetiq

services:

  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    user: "70:70"                      # the alpine image's postgres user
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-assetiq}
      POSTGRES_USER: ${POSTGRES_USER:-assetiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run ./scripts/bootstrap.sh}
      # Without this the image re-runs initdb against a volume it cannot chown.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /run:mode=0755,uid=70,gid=70
      - /var/run/postgresql:mode=0755,uid=70,gid=70
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # CHOWN/SETUID/SETGID/FOWNER/DAC_OVERRIDE: initdb creates and takes ownership
    # of the data directory on first boot. Dropped entirely once initialised, but
    # the container cannot distinguish first boot from later ones.
    cap_add: ["CHOWN", "SETUID", "SETGID", "FOWNER", "DAC_OVERRIDE"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assetiq} -d ${POSTGRES_DB:-assetiq}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.25", memory: 512M }
    networks: [assetiq-data]

  # ── Cache / rate-limiter / SSO state ────────────────────────────────────────
  # Redis is optional to the application — RedisRateLimiter degrades to a no-op
  # and SSO state falls back to memory — but a self-hosted install running more
  # than one backend replica needs it, and readiness reports on it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:1000"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required — run ./scripts/bootstrap.sh}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.1", memory: 128M }
    networks: [assetiq-data]

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    image: ${ASSETIQ_REGISTRY:-public.ecr.aws/assetiq}/assetiq-backend:${ASSETIQ_VERSION:?ASSETIQ_VERSION is required — pin a release tag, never latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod

      # Flyway owns the schema. Hibernate only validates; the app refuses to
      # boot outside a dev profile if this is ever set to a mutating value.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-assetiq}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-assetiq}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required — run ./scripts/bootstrap.sh}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-900000}
      APP_REFRESH_TOKEN_LIFETIME: ${APP_REFRESH_TOKEN_LIFETIME:-PT12H}
      APP_DATA_ENCRYPTION_KEY: ${APP_DATA_ENCRYPTION_KEY:?APP_DATA_ENCRYPTION_KEY is required — run ./scripts/bootstrap.sh}

      # Self-hosted entitlement: a signed key verified locally. No licence
      # server is contacted, and an absent or lapsed key means free-tier
      # quotas, never an outage.
      APP_LICENSE_OFFLINE_ENABLED: ${APP_LICENSE_OFFLINE_ENABLED:-true}
      APP_LICENSE_OFFLINE_KEY: ${APP_LICENSE_OFFLINE_KEY:-}

      APP_CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required — e.g. https://assetiq.example.com}
      # CorsConfig refuses a localhost origin under the prod profile, which would
      # otherwise make every evaluation install crash-loop on first boot.
      # bootstrap.sh sets this to true only when APP_PUBLIC_URL is localhost.
      APP_CORS_ALLOW_LOCALHOST: ${APP_CORS_ALLOW_LOCALHOST:-false}

      # Object storage for generated reports and imports.
      #
      # READ THIS BEFORE LEAVING IT false. There is no local-disk storage
      # backend in the application: with S3 disabled, generated files are held
      # in the backend's JVM heap. They are lost on every restart, they are
      # invisible to a second replica, and the map is never evicted. That is
      # tolerable for evaluation and wrong for production.
      #
      # `docker compose --profile minio up -d` starts a bundled MinIO and this
      # stack points at it. See docs/self-hosting.md.
      APP_STORAGE_S3_ENABLED: ${APP_STORAGE_S3_ENABLED:-false}
      APP_STORAGE_S3_BUCKET: ${APP_STORAGE_S3_BUCKET:-}
      APP_STORAGE_S3_REGION: ${APP_STORAGE_S3_REGION:-us-east-1}
      APP_STORAGE_S3_ENDPOINT: ${APP_STORAGE_S3_ENDPOINT:-}
      APP_STORAGE_S3_PATH_STYLE: ${APP_STORAGE_S3_PATH_STYLE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      APP_EMAIL_ENABLED: ${APP_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    read_only: true
    tmpfs:
      # JVM hsperfdata, Tomcat's multipart spool and Flyway scratch all land in
      # /tmp. exec is required: the JVM maps its perf data file executable.
      - /tmp:mode=1777,exec
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/actuator/health/liveness || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 6
      # Flyway may have a long migration to run on first boot or after an
      # upgrade; restarting mid-migration is how a schema gets wedged.
      start_period: 180s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 1G }
    networks: [assetiq-data, assetiq-internal, assetiq-egress]

  # ── Web UI ──────────────────────────────────────────────────────────────────
  web:
    image: ${ASSETIQ_REGISTRY:-public.ecr.aws/assetiq}/assetiq-web:${ASSETIQ_VERSION:?}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0755,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 192M }
        reservations: { cpus: "0.05", memory: 64M }
    networks: [assetiq-internal]

  # ── Object storage (optional) ───────────────────────────────────────────────
  # Started only with `--profile minio`. The application talks S3 and supports
  # an endpoint override with path-style addressing, which is exactly what
  # MinIO serves, so this needs no application change — it is the difference
  # between generated reports surviving a restart and not.
  #
  #   docker compose --profile minio up -d
  #
  # then set in .env and restart the backend:
  #   APP_STORAGE_S3_ENABLED=true
  #   APP_STORAGE_S3_BUCKET=assetiq
  #   APP_STORAGE_S3_ENDPOINT=http://minio:9000
  #   APP_STORAGE_S3_PATH_STYLE=true
  #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY = the MINIO_ROOT_* values below
  #
  # Create the bucket once, after first start:
  #   docker compose exec minio mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
  #   docker compose exec minio mc mb --ignore-existing local/assetiq
  minio:
    profiles: ["minio"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    user: "1000:1000"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Plain defaults, not `:?` — Compose interpolates every service in the
      # file regardless of which profiles are active, so a required-variable
      # marker here would break `docker compose up` for everyone not using
      # MinIO. bootstrap.sh writes both values; MinIO itself refuses to start
      # on an empty or too-short password, which is the error you want anyway.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
        reservations: { cpus: "0.1", memory: 256M }
    networks: [assetiq-data]

  # ── TLS edge ────────────────────────────────────────────────────────────────
  # Puts the API and the UI on ONE origin. That is not cosmetic: the session is
  # an HttpOnly SameSite=Strict cookie, which a browser will not send to a
  # backend on a different site.
  edge:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:     { condition: service_healthy }
      backend: { condition: service_healthy }
    ports:
      # The container listens on 8080/8443 because an unprivileged process
      # cannot bind below 1024. Docker publishes them on the usual ports.
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0755,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1:8443/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
        reservations: { cpus: "0.05", memory: 32M }
    networks: [assetiq-internal, assetiq-edge]

volumes:
  postgres_data:
  redis_data:
  minio_data:

# assetiq-data     — backend <-> postgres/redis only. internal: no route out.
# assetiq-internal — edge <-> web/backend. internal: no route out.
# assetiq-egress   — backend only, for SMTP and any S3-compatible store the
#                    operator configures. Remove it for a fully air-gapped
#                    install; the offline licence never needs it.
# assetiq-edge     — the only network attached to published host ports.
networks:
  assetiq-data:
    driver: bridge
    internal: true
  assetiq-internal:
    driver: bridge
    internal: true
  assetiq-egress:
    driver: bridge
  assetiq-edge:
    driver: bridge

openapi: 3.0.0
info:
  title: Asset Management Enterprise SaaS API
  description: Complete API documentation for Asset Management system with enterprise features
  version: 1.0.0
  contact:
    name: API Support
    url: https://example.com/support
    email: api-support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8085/api/v1
    description: Local Development
  - url: https://api.example.com/api/v1
    description: Production

paths:
  /auth/login:
    post:
      summary: User login
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '423':
          description: Account temporarily locked after too many failed login attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Account temporarily locked due to too many failed attempts. Try again after 2025-01-01T00:15:00Z"
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      summary: Refresh JWT token
      operationId: refreshToken
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /assets:
    post:
      summary: Create new asset
      operationId: createAsset
      tags:
        - Assets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
      responses:
        '201':
          description: Asset created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
        '403':
          description: Insufficient permissions

    get:
      summary: List assets
      operationId: listAssets
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum: [IN_STOCK, IN_USE, RETIRED]
        - name: departmentId
          in: query
          description: Filter by department UUID
          schema:
            type: string
        - name: categoryId
          in: query
          description: Filter by category UUID
          schema:
            type: string
        - name: page
          in: query
          description: Page number (0-indexed)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          description: Page size
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          description: Sort field and direction (e.g., createdAt,desc)
          schema:
            type: string
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
        '401':
          description: Unauthorized

  /assets/{assetId}:
    get:
      summary: Get asset by ID
      operationId: getAsset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          description: Asset UUID
          schema:
            type: string
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          description: Asset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update asset
      operationId: updateAsset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
      responses:
        '200':
          description: Asset updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '404':
          description: Asset not found
        '400':
          description: Validation error

    delete:
      summary: Delete asset
      operationId: deleteAsset
      tags:
        - Assets
      security:
        - bearerAuth: []
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Asset deleted
        '404':
          description: Asset not found

  /purchase-orders:
    post:
      summary: Create purchase order
      operationId: createPurchaseOrder
      tags:
        - Purchase Orders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderRequest'
      responses:
        '201':
          description: PO created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '400':
          description: Validation error

    get:
      summary: List purchase orders
      operationId: listPurchaseOrders
      tags:
        - Purchase Orders
      security:
        - bearerAuth: []
      parameters:
        - name: departmentId
          in: query
          schema:
            type: string
        - name: supplierId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, APPROVED, REJECTED]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: PO list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurchaseOrder'

  /purchase-orders/{poId}:
    get:
      summary: Get purchase order details
      operationId: getPurchaseOrder
      tags:
        - Purchase Orders
      security:
        - bearerAuth: []
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PO details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          description: PO not found

  /purchase-orders/{poId}/approve:
    post:
      summary: Approve purchase order
      operationId: approvePurchaseOrder
      tags:
        - Purchase Orders
      security:
        - bearerAuth: []
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PO approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrder'
        '404':
          description: PO not found
        '422':
          description: Cannot approve this PO

  /dashboard/summary:
    get:
      summary: Get dashboard summary
      operationId: getDashboardSummary
      tags:
        - Dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  /analytics/assets:
    get:
      summary: Get asset analytics
      operationId: getAssetAnalytics
      tags:
        - Analytics
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [month, quarter, year]
            default: month
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [status, department, category, condition]
      responses:
        '200':
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsData'

  /reports/assets:
    post:
      summary: Generate asset report
      operationId: generateAssetReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRequest'
      responses:
        '201':
          description: Report generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'

  /reports/{reportId}/download:
    get:
      summary: Download report
      operationId: downloadReport
      tags:
        - Reports
      security:
        - bearerAuth: []
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Report not found

  /bulk/assets/import:
    post:
      summary: Bulk import assets
      operationId: bulkImportAssets
      tags:
        - Bulk Operations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV or EXCEL file
                dryRun:
                  type: boolean
                  description: Validate without importing
      responses:
        '202':
          description: Import job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobResponse'

  /bulk/assets/import/{jobId}:
    get:
      summary: Get import job status
      operationId: getImportStatus
      tags:
        - Bulk Operations
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobStatus'

  /webhooks:
    post:
      summary: Create webhook
      operationId: createWebhook
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '201':
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

    get:
      summary: List webhooks
      operationId: listWebhooks
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookList'

  /webhooks/{webhookId}:
    get:
      summary: Get webhook details
      operationId: getWebhook
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Webhook details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

    patch:
      summary: Update webhook
      operationId: updateWebhook
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookRequest'
      responses:
        '200':
          description: Webhook updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

    delete:
      summary: Delete webhook
      operationId: deleteWebhook
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Webhook deleted

  /webhooks/{webhookId}/test:
    post:
      summary: Test webhook delivery
      operationId: testWebhook
      tags:
        - Webhooks
      security:
        - bearerAuth: []
      parameters:
        - name: webhookId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookTestResult'

  /notifications:
    get:
      summary: Get user notifications
      operationId: getNotifications
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [unread, read, all]
            default: unread
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalNotifications:
                    type: integer
                  unreadCount:
                    type: integer
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'

  /notifications/{notificationId}/read:
    patch:
      summary: Mark notification as read
      operationId: markNotificationAsRead
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /notifications/mark-all-read:
    patch:
      summary: Mark all notifications as read
      operationId: markAllNotificationsAsRead
      tags:
        - Notifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  markedAsRead:
                    type: integer
                  markedAt:
                    type: string
                    format: date-time

  /health:
    get:
      summary: Get system health
      operationId: getHealth
      tags:
        - Health & Monitoring
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /health/detailed:
    get:
      summary: Get detailed health information
      operationId: getDetailedHealth
      tags:
        - Health & Monitoring
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detailed health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedHealthStatus'

  /metrics:
    get:
      summary: Get API metrics
      operationId: getMetrics
      tags:
        - Health & Monitoring
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
        - name: metric
          in: query
          schema:
            type: string
            enum: [requests, errors, latency]
      responses:
        '200':
          description: API metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiMetrics'

  # ── SSO ──────────────────────────────────────────────────────────────────────

  /auth/sso/config/{orgId}:
    get:
      summary: Get SSO configuration for an organisation
      operationId: getSsoConfig
      tags:
        - SSO
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Organisation ID
      responses:
        '200':
          description: SSO configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                    example: GOOGLE
                  enabled:
                    type: boolean
                  loginUrl:
                    type: string
                    example: https://app.assetiq.io/api/v1/auth/sso/initiate?orgId=...&provider=GOOGLE
        '404':
          description: Organisation not found or SSO not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sso/initiate:
    get:
      summary: Initiate SSO login — redirects browser to IdP
      operationId: ssoInitiate
      tags:
        - SSO
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Organisation whose IdP to use
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [GOOGLE, MICROSOFT, OKTA, GENERIC_OIDC]
          description: OIDC provider
      responses:
        '302':
          description: Redirect to IdP authorization URL
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Organisation or SSO config not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sso/callback:
    get:
      summary: OIDC callback — exchange code for JWT
      operationId: ssoCallback
      tags:
        - SSO
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Authorization code from IdP
        - name: state
          in: query
          required: true
          schema:
            type: string
          description: CSRF nonce issued by /initiate, valid 10 minutes
      responses:
        '200':
          description: Authentication successful — returns JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing or expired state nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Code exchange failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sso/saml/acs:
    post:
      summary: SAML ACS endpoint — process assertion and issue JWT
      operationId: samlAcs
      tags:
        - SSO
      parameters:
        - name: orgId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: SAML assertion valid — returns JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid SAML assertion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Cloud Asset Sync ──────────────────────────────────────────────────────────

  /cloud-assets/sync:
    post:
      summary: Trigger cloud asset discovery for one provider
      operationId: syncCloudAssets
      tags:
        - Cloud Assets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
              properties:
                provider:
                  type: string
                  enum: [AWS, AZURE, GCP]
                  description: Cloud provider to scan
                regions:
                  type: array
                  items:
                    type: string
                  description: Provider-specific region codes. Omit to use the configured default.
                  example: ["us-east-1", "eu-west-1"]
      responses:
        '200':
          description: Sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '400':
          description: Missing or invalid provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: "Unknown provider 'XYZ'. Valid values: AWS, AZURE, GCP."
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority

  /cloud-assets/sync/all:
    post:
      summary: Trigger cloud asset discovery across all configured providers
      operationId: syncAllCloudAssets
      tags:
        - Cloud Assets
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                regions:
                  type: array
                  items:
                    type: string
                  description: Region codes forwarded to all providers. Omit to use provider defaults.
                  example: ["us-east-1", "europe-west1"]
      responses:
        '200':
          description: All-provider sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResult'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority

  # ── BOG Compliance ────────────────────────────────────────────────────────────

  /compliance/bog/report:
    get:
      summary: Get BOG ICT Directive compliance report (JSON)
      operationId: getBogReport
      tags:
        - BOG Compliance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Full compliance report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BogComplianceReport'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority

  /compliance/bog/report/pdf:
    get:
      summary: Download BOG compliance report as PDF
      operationId: getBogReportPdf
      tags:
        - BOG Compliance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PDF file download
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="bog-compliance-report.pdf"'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority

  /compliance/bog/controls:
    post:
      summary: Create or update (upsert) a BOG control by directiveRef
      operationId: upsertBogControl
      tags:
        - BOG Compliance
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BogControlRequest'
      responses:
        '200':
          description: Control created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BogControlResponse'
        '400':
          description: Missing directiveRef or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority

  /compliance/bog/controls/{id}/status:
    patch:
      summary: Update the status of a BOG control
      operationId: updateBogControlStatus
      tags:
        - BOG Compliance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Control ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [NOT_IMPLEMENTED, PARTIAL, IMPLEMENTED, NOT_APPLICABLE]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BogControlResponse'
        '400':
          description: Missing or invalid status
        '401':
          description: Not authenticated
        '403':
          description: Insufficient authority
        '404':
          description: Control not found


  /auth/register:
    post:
      summary: Register a new user
      operationId: registerUser
      tags:
          - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  description: min 8 chars
                organisationId:
                  type: string
                  description: UUID
                phone:
                  type: string
                jobTitle:
                  type: string
                roleId:
                  type: string
                  description: optional UUID
      responses:
        '201':
          description: User registered
        '400':

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginResponse:
      type: object
      required:
        - token
        - expiresIn
        - tokenType
        - user
      properties:
        token:
          type: string
        expiresIn:
          type: integer
          description: Token expiry in seconds
        tokenType:
          type: string
          default: Bearer
        user:
          $ref: '#/components/schemas/User'

    TokenResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: integer
        tokenType:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        organisationId:
          type: string
          format: uuid

    AssetRequest:
      type: object
      required:
        - name
        - assetTag
        - categoryId
        - departmentId
        - purchaseCost
        - currency
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        assetTag:
          type: string
        assetType:
          type: string
        serialNumber:
          type: string
        categoryId:
          type: string
          format: uuid
        departmentId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        purchaseCost:
          type: number
          format: double
        currency:
          type: string
          enum: [USD, EUR, GBP]
        status:
          type: string
          enum: [IN_STOCK, IN_USE, RETIRED]
        condition:
          type: string
          enum: [POOR, FAIR, GOOD, EXCELLENT]

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        assetTag:
          type: string
        status:
          type: string
        condition:
          type: string
        purchaseCost:
          type: number
        currentBookValue:
          type: number
        organisationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PurchaseOrderRequest:
      type: object
      required:
        - poNumber
        - totalAmount
        - currency
        - departmentId
        - supplierId
      properties:
        poNumber:
          type: string
        totalAmount:
          type: number
          format: double
        currency:
          type: string
        departmentId:
          type: string
          format: uuid
        supplierId:
          type: string
          format: uuid
        remarks:
          type: string
        status:
          type: string
          enum: [DRAFT, APPROVED, REJECTED]

    PurchaseOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        poNumber:
          type: string
        totalAmount:
          type: number
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DashboardSummary:
      type: object
      properties:
        totalAssets:
          type: integer
        assetsInUse:
          type: integer
        assetsInStock:
          type: integer
        assetsRetired:
          type: integer
        totalAssetValue:
          type: number
        maintenanceAlerts:
          type: integer
        pendingPurchaseOrders:
          type: integer

    AnalyticsData:
      type: object
      properties:
        period:
          type: string
        groupBy:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
              value:
                type: number
              percentage:
                type: number

    ReportRequest:
      type: object
      required:
        - format
      properties:
        format:
          type: string
          enum: [PDF, EXCEL, CSV]
        includeDetails:
          type: boolean
        filters:
          type: object
        columns:
          type: array
          items:
            type: string

    ReportResponse:
      type: object
      properties:
        reportId:
          type: string
          format: uuid
        format:
          type: string
        status:
          type: string
        downloadUrl:
          type: string
        generatedAt:
          type: string
          format: date-time

    BulkJobResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
        totalRows:
          type: integer
        successCount:
          type: integer
        errorCount:
          type: integer

    BulkJobStatus:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
        totalRows:
          type: integer
        successCount:
          type: integer
        errorCount:
          type: integer
        warnings:
          type: array
          items:
            type: object

    WebhookRequest:
      type: object
      required:
        - name
        - url
        - events
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastTriggeredAt:
          type: string
          format: date-time
        deliveryCount:
          type: integer

    WebhookList:
      type: object
      properties:
        totalWebhooks:
          type: integer
        activeWebhooks:
          type: integer
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/Webhook'

    WebhookTestResult:
      type: object
      properties:
        webhookId:
          type: string
          format: uuid
        testStatus:
          type: string
        statusCode:
          type: integer
        responseTime:
          type: integer

    Notification:
      type: object
      properties:
        notificationId:
          type: string
          format: uuid
        type:
          type: string
        title:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        timestamp:
          type: string
          format: date-time
        components:
          type: object

    DetailedHealthStatus:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time
        components:
          type: object
        uptime:
          type: string
        version:
          type: string

    ApiMetrics:
      type: object
      properties:
        period:
          type: string
        totalRequests:
          type: integer
        successfulRequests:
          type: integer
        failedRequests:
          type: integer
        successRate:
          type: string
        averageLatency:
          type: number


    SyncResult:
      type: object
      properties:
        status:
          type: string
          example: completed
        provider:
          type: string
          example: AWS
          description: Present on single-provider sync; absent on syncAll
        assetsUpserted:
          type: integer
          example: 42
        message:
          type: string
          example: "AWS asset sync completed. 42 asset(s) upserted."

    BogControlRequest:
      type: object
      required:
        - directiveRef
      properties:
        directiveRef:
          type: string
          example: ICT.4.2
          description: BOG directive reference used as upsert key
        requirement:
          type: string
          example: Implement endpoint detection and response on all devices
        status:
          type: string
          enum: [NOT_IMPLEMENTED, PARTIAL, IMPLEMENTED, NOT_APPLICABLE]
          example: PARTIAL
        gapDescription:
          type: string
          example: EDR deployed on 60% of endpoints
        remediationPlan:
          type: string
          example: Complete rollout by Q3 2025
        targetDate:
          type: string
          format: date-time
          example: "2025-09-30T00:00:00Z"
        evidenceUrl:
          type: string
          example: https://docs.internal/edr-rollout

    BogControlResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        directiveRef:
          type: string
          example: ICT.4.2
        status:
          type: string
          enum: [NOT_IMPLEMENTED, PARTIAL, IMPLEMENTED, NOT_APPLICABLE]

    BogDomainSummary:
      type: object
      properties:
        domain:
          type: string
          example: ICT
        totalControls:
          type: integer
        implemented:
          type: integer
        partial:
          type: integer
        notImplemented:
          type: integer
        notApplicable:
          type: integer
        compliancePercent:
          type: number
          format: double
          example: 87.5
        status:
          type: string
          enum: [COMPLIANT, PARTIALLY_COMPLIANT, NON_COMPLIANT]

    BogGapEntry:
      type: object
      properties:
        directiveRef:
          type: string
          example: ICT.4.2
        requirement:
          type: string
        status:
          type: string
          enum: [NOT_IMPLEMENTED, PARTIAL]
        gapDescription:
          type: string
        remediationPlan:
          type: string
        targetDate:
          type: string
          format: date-time
        evidenceUrl:
          type: string
        owner:
          type: string
          example: Kwame Asante

    BogComplianceReport:
      type: object
      properties:
        reportType:
          type: string
          example: BOG_ICT_DIRECTIVE
        organisationId:
          type: string
          format: uuid
        organisationName:
          type: string
          example: First Bank GH
        generatedAt:
          type: string
          format: date-time
        summary:
          type: object
          properties:
            totalControls:
              type: integer
            implemented:
              type: integer
            partial:
              type: integer
            notImplemented:
              type: integer
            notApplicable:
              type: integer
            compliancePercent:
              type: number
              format: double
              example: 75.0
            overallStatus:
              type: string
              enum: [COMPLIANT, PARTIALLY_COMPLIANT, NON_COMPLIANT]
        domains:
          type: array
          items:
            $ref: '#/components/schemas/BogDomainSummary'
        openGaps:
          type: array
          items:
            $ref: '#/components/schemas/BogGapEntry'

    Error:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time

    ValidationError:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
# P0-4: Continuous integration for the AssetIQ backend.
#
# This workflow must stay green for a PR to merge. It compiles the project,
# runs the unit + slice test suites, and publishes the Jacoco coverage report
# (the 30% line-coverage gate is enforced by the build itself — see P0-5).
#
# Triggers:
#   - Every push to main (post-merge verification)
#   - Every pull request targeting main
#   - Manual (workflow_dispatch) so releases can be re-verified on demand
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Non-secret test fixtures. Real secrets live only in prod environments.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/assetiq_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: 6379
      # The StartupSecurityValidator insists on high-entropy dev secrets; give it some.
      APP_JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production-xxxxxxxxxxxxxxxxxxxx
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      APP_STARTUP_SKIP_SECRET_VALIDATION: "true"
      SPRING_PROFILES_ACTIVE: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Show toolchain versions
        run: |
          java -version
          ./mvnw --version

      - name: Compile (offline-friendly)
        run: ./mvnw -B -ntp -DskipTests compile

      - name: Run unit + slice tests
        run: ./mvnw -B -ntp verify
        env:
          # Surefire / Failsafe pick these up; keep CI's error output tight.
          MAVEN_OPTS: "-XX:+UseG1GC -Xmx2g"

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**

      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/**
          if-no-files-found: ignore

      - name: Publish JUnit results (PR annotations)
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          require_tests: false

  build-docker-image:
    name: Docker image smoke-build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: assetiq-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migration-integrity:
    name: Flyway migration integrity check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assetiq_migration_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Flyway migrations against a fresh database
        run: |
          ./mvnw -B -ntp flyway:migrate \
            -Dflyway.url=jdbc:postgresql://localhost:5432/assetiq_migration_check \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres \
            -Dflyway.locations=classpath:db/migration
        env:
          SPRING_PROFILES_ACTIVE: test
          APP_STARTUP_SKIP_SECRET_VALIDATION: "true"
          APP_JWT_SECRET: ci-only-jwt-secret-do-not-use-in-production-xxxxxxxxxxxxxxxxxxxx
          PAYSTACK_SECRET_KEY: sk_test_ci_placeholder

      - name: Assert no pending migrations remain
        run: |
          PENDING=$(./mvnw -B -ntp flyway:info \
            -Dflyway.url=jdbc:postgresql://localhost:5432/assetiq_migration_check \
            -Dflyway.user=postgres \
            -Dflyway.password=postgres 2>/dev/null | grep "^| Pending" || true)
          if [ -n "$PENDING" ]; then
            echo "ERROR: Pending migrations detected after apply:"
            echo "$PENDING"
            exit 1
          fi
          echo "OK — all migrations applied, none pending."

  currency-lint:
    name: Currency consistency lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Forbid hardcoded currency literals in business logic
        run: |
          # Multi-currency: service/controller code must derive the currency
          # from the tenant (CurrencyResolver), never a hardcoded ISO literal.
          # Allow-listed by design:
          #   - models/         → JPA entities legitimately set a non-null column
          #                       default; the create path overrides it via
          #                       CurrencyResolver.
          #   - CurrencyResolver / ExchangeRate / CurrencyConverter → the
          #                       currency machinery itself.
          #   - *Seeder / *Test → config seeders map application.yml; tests.
          #   - lines marked "// allowed".
          VIOLATIONS=$(grep -rnE --include="*.java" \
            '"(USD|GHS|NGN|EUR|GBP|KES|ZAR|CAD)"' \
            src/main/java/com/assetiq/services/ \
            src/main/java/com/assetiq/controllers/ | \
            grep -v "CurrencyResolver\|ExchangeRate\|CurrencyConverter\|Seeder\|// allowed" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Hardcoded currency literal in business logic — resolve via CurrencyResolver instead:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK — no hardcoded currency literals in service/controller code."

      - name: Verify platform default currency is USD
        run: |
          grep -q 'APP_BILLING_DEFAULT_CURRENCY:USD' src/main/resources/application.yml && \
            echo "OK: app.billing.default-currency defaults to USD" || \
            (echo "ERROR: app.billing.default-currency is not USD" && exit 1)

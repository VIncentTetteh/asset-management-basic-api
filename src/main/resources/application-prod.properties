# Production profile — minimal logging, HTTPS enforced
logging.level.root=WARN
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Enforce HTTPS
server.ssl.enabled=true

# Never expose stack traces in prod
server.error.include-stacktrace=never
server.error.include-exception=false

# Do NOT allow startup with the default JWT secret
app.startup.skip-secret-validation=false

# Restrict actuator endpoints in prod
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

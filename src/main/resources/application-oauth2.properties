# OAuth2 profile-specific configuration
# Activate with: --spring.profiles.active=oauth2 (or SPRING_PROFILES_ACTIVE=oauth2)
# Requires the following environment variables to be provided with non-empty values.

# Google OAuth2 Client Registration (no default fallbacks to avoid invalid empty registrations)
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

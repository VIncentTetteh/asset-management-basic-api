spring.application.name=${SPRING_APPLICATION_NAME:Asset Management System}
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ── App Mode ──────────────────────────────────────────────────────────────────
# cloud      = SaaS hosted version (default). All license enforcement is disabled.
# standalone = Self-hosted on-premise version. License key required.
app.mode=${APP_MODE:cloud}

# ── License (standalone mode only) ───────────────────────────────────────────
# These properties are read but ignored when app.mode=cloud.
app.license.key=${ASSETIQ_LICENSE_KEY:}
app.license.server-url=${LICENSE_SERVER_URL:https://license.assetiq.io}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}

# JPA/Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Let Hibernate infer dialect from the JDBC driver/URL
# (avoids deprecation warning with modern PostgresSQL drivers)
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Batch fetch strategy to prevent N+1 queries and massive JOIN statements
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Disable cartesian product joining - use subqueries instead for collections
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true


# Auditing
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration (overridden per-profile in application-dev.properties / application-prod.properties)
logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# Server Configuration
server.compression.enabled=false
server.compression.min-response-size=1024
server.servlet.context-path=/
# HTTP Header Size Limits (fix for Swagger UI "Request Header Fields Too Large" error)
server.tomcat.max-http-request-header-size=64KB
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-http-response-header-size=64KB
server.tomcat.max-http-header-count=500

# Security - JWT
app.jwt.secret=${APP_JWT_SECRET:this-default-secret-must-be-at-least-32-characters-long-change-in-production}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

# ===== AI / LLM =====
#
# Select the provider: anthropic | groq | ollama
#   groq     — FREE. Llama 3.3 70B via Groq. Get a key at console.groq.com
#   anthropic — Paid.  Claude Haiku. Get a key at console.anthropic.com
#   ollama   — FREE, local. Run `ollama pull llama3.1` then point to localhost
#
ai.provider=${AI_PROVIDER:groq}

# Groq (free tier — recommended)
groq.api.key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

# Anthropic
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

# Ollama (local)
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.1:8b}

# ===== PRODUCTION FEATURES =====

# OpenAPI / Swagger Documentation
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
springdoc.show-login-endpoint=true

# Redis Caching Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Actuator / Health Checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics Configuration
management.metrics.enable.all=true
management.prometheus.metrics.export.enabled=true


# Log Aggregation (Logstash/ELK Stack)
logging.config=classpath:logback-spring.xml
logstash.tcp.host=${LOGSTASH_HOST:localhost}
logstash.tcp.port=${LOGSTASH_PORT:8009}

# API Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=100
app.rate-limiting.requests-per-hour=5000

# Correlation ID Configuration
app.correlation-id.header-name=X-Request-ID
app.correlation-id.enabled=true

# HTTPS/SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=asset-management

# API Versioning
app.api.version=v1
app.api.supported-versions=v1,v2

# Error Handling ? never expose internals by default; dev profile overrides these
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Request/Response Timeout
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=20000
server.tomcat.accept-count=100

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,https://leonard-untaxing-kara.ngrok-free.dev,http://localhost:5173}

# Email (SMTP)
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:no-reply@assetiq.local}
app.email.from-name=${APP_EMAIL_FROM_NAME:AssetIQ}
app.email.base-url=${APP_EMAIL_BASE_URL:http://localhost:3000}
app.email.support=${APP_EMAIL_SUPPORT:support@assetiq.local}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.enable=true
management.health.mail.enabled=${APP_EMAIL_ENABLED:false}

# ── Storage (AWS S3) — Global settings ───────────────────────────────────────
# These apply to all organisations that have useGlobalConfig=true.
# Individual organisations can override every field via the
# /api/v1/organisations/{id}/storage-config endpoint.
app.storage.s3.enabled=${APP_STORAGE_S3_ENABLED:false}
app.storage.s3.bucket=${APP_STORAGE_S3_BUCKET:}
app.storage.s3.region=${APP_STORAGE_S3_REGION:us-east-1}
app.storage.s3.endpoint=${APP_STORAGE_S3_ENDPOINT:}
app.storage.s3.path-style-access=${APP_STORAGE_S3_PATH_STYLE:false}
app.storage.s3.kms-key-id=${APP_STORAGE_S3_KMS_KEY_ID:}
app.storage.s3.report-prefix=${APP_STORAGE_S3_REPORT_PREFIX:reports}
app.storage.s3.import-prefix=${APP_STORAGE_S3_IMPORT_PREFIX:imports}
app.storage.s3.presign-minutes=${APP_STORAGE_S3_PRESIGN_MINUTES:15}

# ── Storage — Per-organisation overrides ─────────────────────────────────────
# Whether organisations are allowed to configure their own dedicated S3 buckets.
# Set to false to restrict all orgs to the global config above.
app.storage.org-override.allowed=${APP_STORAGE_ORG_OVERRIDE_ALLOWED:true}

# ── Database migrations (Flyway) ──────────────────────────────────────────────
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# baseline-on-migrate=true is required the FIRST time Flyway runs against a
# database that already has tables (previously managed by Hibernate ddl-auto).
# Flyway creates its flyway_schema_history table and records the existing schema
# as "baselined" at version 0, then applies V1, V2… forward from there.
# Safe to leave on permanently — once the history table exists Flyway ignores it.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.flyway.validate-on-migrate=true

# Once Flyway is running, Hibernate should only validate — never mutate — the schema.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# Billing / Paystack
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}
paystack.secret.key=${PAYSTACK_SECRET_KEY:}
paystack.public.key=${PAYSTACK_PUBLIC_KEY:}
paystack.timeout-seconds=${PAYSTACK_TIMEOUT_SECONDS:30}
app.billing.default-currency=${APP_BILLING_DEFAULT_CURRENCY:GHS}
app.billing.callback-url=${APP_BILLING_CALLBACK_URL:http://localhost:3000/billing/verify}
app.billing.plans.basic.amount-minor=${APP_BILLING_BASIC_AMOUNT:2000000}
app.billing.plans.premium.amount-minor=${APP_BILLING_PREMIUM_AMOUNT:10000000}
app.billing.plans.basic.paystack-plan-code=${APP_BILLING_BASIC_PAYSTACK_PLAN_CODE:}
app.billing.plans.premium.paystack-plan-code=${APP_BILLING_PREMIUM_PAYSTACK_PLAN_CODE:}

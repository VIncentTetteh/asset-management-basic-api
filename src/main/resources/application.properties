spring.application.name=${SPRING_APPLICATION_NAME:Asset Management System}
server.port=${SERVER_PORT:8080}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}

# JPA/Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Entity Soft Delete Filter
spring.jpa.properties.hibernate.use_entity_where_clause_for_collections=true

# Auditing
spring.jpa.properties.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.hibernate.envers.revision_field_name=rev
spring.jpa.properties.hibernate.envers.revision_type_field_name=revtype

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# Server Configuration
server.compression.enabled=true
server.compression.min-response-size=1024
server.servlet.context-path=/api

# Security
spring.security.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
spring.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== PRODUCTION FEATURES =====

# OpenAPI / Swagger Documentation
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.show-actuator=true
springdoc.show-login-endpoint=true

# Redis Caching Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=60000
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Actuator / Health Checks
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.health.probes.enabled=true
management.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Metrics Configuration
management.metrics.enable.all=true
management.metrics.export.prometheus.enabled=true


# Log Aggregation (Logstash/ELK Stack)
logging.config=classpath:logback-spring.xml
logstash.tcp.host=${LOGSTASH_HOST:localhost}
logstash.tcp.port=${LOGSTASH_PORT:5000}

# API Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.requests-per-minute=100
app.rate-limiting.requests-per-hour=5000

# Correlation ID Configuration
app.correlation-id.header-name=X-Request-ID
app.correlation-id.enabled=true

# HTTPS/SSL Configuration
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=asset-management

# API Versioning
app.api.version=v1
app.api.supported-versions=v1,v2

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Request/Response Timeout
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=20000
server.tomcat.accept-count=100


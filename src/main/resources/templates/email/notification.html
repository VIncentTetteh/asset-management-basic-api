<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Notification</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #111827;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
      <h2 style="margin: 0 0 12px 0;" th:text="${title}">Notification</h2>
      <p style="margin: 0 0 12px 0;">Hi <span th:text="${firstName} ?: 'there'"></span>,</p>
      <p style="margin: 0 0 16px 0;" th:text="${message}"></p>
      <p style="margin: 0 0 24px 0;" th:if="${actionUrl} != null">
        <a th:href="${actionUrl}" style="display: inline-block; padding: 10px 16px; background: #111827; color: #fff; text-decoration: none; border-radius: 4px;">View Details</a>
      </p>
      <p style="font-size: 12px; color: #6b7280; margin: 0;">
        You are receiving this because email notifications are enabled for this category.
      </p>
    </div>
  </body>
</html>

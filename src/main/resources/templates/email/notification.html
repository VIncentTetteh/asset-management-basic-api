<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${title}?: 'Notification'">Notification</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;">

          <!-- Header -->
          <tr>
            <td style="background:#0f172a;border-radius:12px 12px 0 0;padding:28px 40px;text-align:center;">
              <span style="color:#f8fafc;font-size:20px;font-weight:700;" th:text="${appName}">AssetIQ</span>
            </td>
          </tr>

          <!-- Card body -->
          <tr>
            <td style="background:#ffffff;padding:40px;border-left:1px solid #e2e8f0;border-right:1px solid #e2e8f0;">
              <div style="text-align:center;margin-bottom:24px;">
                <div style="display:inline-block;background:#eff6ff;border:2px solid #bfdbfe;border-radius:50%;width:60px;height:60px;line-height:56px;text-align:center;font-size:26px;">&#128276;</div>
              </div>

              <h1 style="color:#0f172a;font-size:20px;font-weight:700;margin:0 0 6px 0;text-align:center;" th:text="${title}?: 'Notification'">Notification</h1>

              <p style="color:#1e293b;font-size:15px;margin:24px 0 12px 0;">
                Hi <strong th:text="${firstName}?: 'there'">there</strong>,
              </p>
              <p style="color:#475569;font-size:15px;line-height:1.65;margin:0 0 28px 0;" th:text="${message}">You have a new notification.</p>

              <!-- CTA (conditional) -->
              <div th:if="${actionUrl}" style="text-align:center;margin-bottom:28px;">
                <a th:href="${actionUrl}" href="#"
                   style="display:inline-block;background:#0f172a;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;padding:14px 32px;border-radius:8px;">
                  View Details →
                </a>
              </div>

              <hr style="border:none;border-top:1px solid #f1f5f9;margin:24px 0;"/>
              <p style="color:#94a3b8;font-size:13px;margin:0;">
                You are receiving this notification because email alerts are enabled for your account.
                Questions? Contact <a th:href="'mailto:' + ${supportEmail}" style="color:#3b82f6;text-decoration:none;" th:text="${supportEmail}">support</a>.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:0 0 12px 12px;padding:18px 40px;text-align:center;">
              <p style="color:#94a3b8;font-size:12px;margin:0;">© <span th:text="${appName}">AssetIQ</span> · System Notification</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>

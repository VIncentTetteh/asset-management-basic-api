<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Welcome</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #111827;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
      <h2 style="margin: 0 0 12px 0;">Welcome to <span th:text="${appName}"></span></h2>
      <p style="margin: 0 0 12px 0;">Hi <span th:text="${firstName} ?: 'there'"></span>,</p>
      <p style="margin: 0 0 16px 0;">
        Your organization <strong th:text="${organisationName}"></strong> is set up and ready.
        You can sign in with your admin account at the link below.
      </p>
      <p style="margin: 0 0 24px 0;">
        <a th:href="${loginUrl}" style="display: inline-block; padding: 10px 16px; background: #059669; color: #fff; text-decoration: none; border-radius: 4px;">Go to Login</a>
      </p>
      <p style="font-size: 12px; color: #6b7280; margin: 0;">
        If you have questions, contact <span th:text="${supportEmail}"></span>.
      </p>
    </div>
  </body>
</html>

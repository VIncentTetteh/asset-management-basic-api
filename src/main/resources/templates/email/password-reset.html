<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Password Reset</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #1f2937;">
    <div style="max-width: 600px; margin: 0 auto; padding: 24px;">
      <h2 style="margin: 0 0 12px 0;">Reset your password</h2>
      <p style="margin: 0 0 12px 0;">Hi <span th:text="${firstName} ?: 'there'"></span>,</p>
      <p style="margin: 0 0 16px 0;">
        We received a request to reset your password for <strong th:text="${appName}"></strong>.
        This link will expire in <span th:text="${expiresHours}"></span> hours.
      </p>
      <p style="margin: 0 0 24px 0;">
        <a th:href="${resetUrl}" style="display: inline-block; padding: 10px 16px; background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px;">Reset Password</a>
      </p>
      <p style="font-size: 12px; color: #6b7280; margin: 0;">
        If you did not request this, you can safely ignore this email.
      </p>
      <p style="font-size: 12px; color: #6b7280; margin: 8px 0 0 0;">
        Need help? Contact <span th:text="${supportEmail}"></span>
      </p>
    </div>
  </body>
</html>

# ── Development profile ───────────────────────────────────────────────────────
# Activated via: SPRING_PROFILES_ACTIVE=dev
# Verbose logging, in-memory cache (no Redis needed), relaxed security constraints.

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Use simple in-memory cache in dev so Redis is not required.
  cache:
    type: simple

logging:
  level:
    com.assetiq: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

management:
  endpoint:
    health:
      show-details: always
      show-components: always

# ── OpenAPI / Swagger ──────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

app:
  startup:
    # Allow dev startup without enforcing production secret constraints.
    skip-secret-validation: true
  auth:
    # The AuthController field default is secure (true) as of this change;
    # dev runs over plain http://localhost, so the Secure cookie flag must be
    # relaxed explicitly here rather than via an implicit code-level default.
    cookie-secure: false
    # Local dev usually has no SMTP server, so a verification link would never
    # arrive and every freshly registered tenant would be unable to sign in.
    require-email-verification: false

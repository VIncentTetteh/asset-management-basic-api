# Development profile — verbose logging, no SSL requirement
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Allow dev startup without enforcing production secret constraints
app.startup.skip-secret-validation=true

# Show full health details in dev
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Expose full error details in dev for easier debugging
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always

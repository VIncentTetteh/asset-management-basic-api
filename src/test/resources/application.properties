spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=VALUE,MONTH,YEAR,INTERVAL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.sql.init.mode=never

# Security - JWT (test-only)
app.jwt.secret=unit-test-secret-must-be-at-least-32-bytes-long
app.jwt.expiration=86400000
app.startup.skip-secret-validation=true
# Deterministic 32-byte key for exercising encrypted secret storage in tests only.
app.security.data-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Billing - Paystack (test-only)
paystack.secret.key=sk_test_dummy_key
paystack.public.key=pk_test_dummy_key

# CORS - test only
app.cors.allowed-origins=https://example.com

# Auth cookie - test only. AuthController is secure-by-default (@Value default true)
# and only the dev profile relaxes it, so MockMvc's plain-HTTP requests would never
# be able to use the cookie. Mirrors application-dev.yml; prod stays env-driven true.
app.auth.cookie-secure=false

# Email verification - off by default for tests so the existing suites can register a
# tenant and immediately use its token. EmailVerificationEnforcementTest turns it back
# on with @TestPropertySource to prove the gate actually blocks.
app.auth.require-email-verification=false

# Email - test only
app.email.enabled=false
management.health.mail.enabled=false

# Storage - test only. The heap-backed backend is opt-in everywhere now
# (see InMemoryFileStorageService); the test suite is the case it exists for.
# The filesystem backend is off so tests do not create directories on disk;
# FilesystemFileStorageServiceTest drives it directly against a @TempDir.
app.storage.s3.enabled=false
app.storage.filesystem.enabled=false
app.storage.in-memory.enabled=true

# Webhooks - test tuning
app.webhook.delivery.max-attempts=3
app.webhook.delivery.backoff-millis=1
# The integration harness uses an ephemeral loopback HTTP server. The service also
# requires the active profile to be exactly "test", so this cannot relax production SSRF controls.
app.webhook.allow-local-test-endpoints=true

# Disable Redis for tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=none

# Trusted proxy - test only. RateLimitingInterceptor only honours X-Client-ID and
# X-Forwarded-For from a trusted proxy CIDR, because a bucket key the caller can
# choose is no rate limit at all. MockMvc requests originate from 127.0.0.1, so
# trusting loopback here lets suites keep using X-Client-ID to get their own bucket
# and avoid throttling each other. Production leaves this unset (never trusted);
# set it to the load balancer's egress CIDR when deploying behind one.
app.rate-limiting.trusted-proxy-cidrs=127.0.0.1/32

{{- if .Values.backend.enabled }}
{{- $tag := include "assetiq.backend.tag" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "assetiq.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assetiq.labels" (dict "root" $ "component" "backend" "version" $tag) | nindent 4 }}
  {{- with .Values.backend.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    # Port name "http" is contractual: the ServiceMonitor scrapes by name.
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "assetiq.selectorLabels" (dict "root" $ "component" "backend") | nindent 4 }}
{{- end }}

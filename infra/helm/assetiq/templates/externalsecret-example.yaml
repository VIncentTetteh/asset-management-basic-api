{{- if .Values.externalSecret.enabled }}
{{- $tag := include "assetiq.backend.tag" . }}
{{- /*
External Secrets Operator example.

This object contains REMOTE KEY NAMES ONLY. No secret value is present in this
chart, in values.yaml, or in the rendered manifest — ESO reads the provider
(AWS Secrets Manager / Vault / ...) at runtime and materialises the Secret named
by backend.existingSecret in this namespace.

apiVersion: external-secrets.io/v1 is the GA version (ESO >= 0.14). Override
with externalSecret.apiVersion: external-secrets.io/v1beta1 on older operators.
*/}}
apiVersion: {{ default "external-secrets.io/v1" .Values.externalSecret.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "assetiq.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assetiq.labels" (dict "root" $ "component" "backend" "version" $tag) | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    # MUST equal backend.existingSecret — that is the name the Deployment
    # references via secretKeyRef.
    name: {{ include "assetiq.backend.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ $.Values.externalSecret.remoteKey | quote }}
        property: {{ .property }}
    {{- end }}
{{- end }}

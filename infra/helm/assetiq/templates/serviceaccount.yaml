{{- if and .Values.backend.enabled .Values.backend.serviceAccount.create }}
{{- $tag := include "assetiq.backend.tag" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "assetiq.backend.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assetiq.labels" (dict "root" $ "component" "backend" "version" $tag) | nindent 4 }}
  {{- with .Values.backend.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The backend talks to Postgres/Redis/S3, never to the Kubernetes API. Mounting
# the SA token would hand every RCE a cluster credential for nothing.
automountServiceAccountToken: {{ .Values.backend.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.web.enabled .Values.web.serviceAccount.create }}
{{- $webTag := include "assetiq.web.tag" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "assetiq.web.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "assetiq.labels" (dict "root" $ "component" "web" "version" $webTag) | nindent 4 }}
  {{- with .Values.web.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.web.serviceAccount.automountServiceAccountToken }}
{{- end }}

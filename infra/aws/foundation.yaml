AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AssetIQ staging foundation. Owns the stateful and security resources whose
  lifecycle must outlive any single deploy: the KMS key, secrets, container
  registry, S3 buckets, the Postgres instance, and the IAM role the application
  instance assumes. Compute and CDN live in a separate stack so they can be
  replaced without ever putting the database at risk.

Parameters:
  ProjectName:
    Type: String
    Default: assetiq
  Environment:
    Type: String
    Default: staging
    AllowedValues: [dev, staging, prod]
  Team:
    Type: String
    Default: platform
  CostCenter:
    Type: String
    Default: engineering
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the database and application instance.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two subnets in different AZs, required by the DB subnet group.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  CloudFrontOriginPrefixListId:
    Type: String
    Default: pl-a3a144ca
    Description: >
      AWS managed prefix list com.amazonaws.global.cloudfront.origin-facing for
      this region. Scoping instance ingress to it keeps the plain HTTP backend
      unreachable except through the CDN. The id is region specific.
  DbBackupRetentionDays:
    Type: Number
    Default: 7
    Description: >
      Enables automated backups and point in time recovery. Any value above zero
      turns PITR on; zero disables backups entirely and must never be used here.
    MinValue: 1

Mappings:
  # Postgres 16.14 pinned deliberately. An unpinned minor version lets a
  # replacement of this stack silently move the engine underneath the data.
  EngineVersions:
    Postgres:
      Version: "16.14"

Resources:

  # ---------------------------------------------------------------------------
  # Encryption
  # ---------------------------------------------------------------------------

  SecretsKey:
    Type: AWS::KMS::Key
    # Retained on stack deletion: destroying the key would make every secret and
    # every encrypted backup permanently unreadable, including ones restored later.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts AssetIQ staging secrets and the database at rest.
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          # The account root retains administrative control. Without this the key
          # becomes unmanageable the moment the creating principal loses access.
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          # Data-plane use is confined to the services that legitimately need it.
          # ViaService means a stolen set of credentials cannot call Decrypt
          # directly; the call has to arrive through Secrets Manager or RDS.
          - Sid: AllowUseThroughSecretsManagerAndRds
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:GenerateDataKey
              - kms:CreateGrant
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService:
                  - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
                  - !Sub "rds.${AWS::Region}.amazonaws.com"
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Team, Value: !Ref Team }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: !Ref CostCenter }
        - { Key: GitRepo, Value: "github.com/VIncentTetteh/asset-management-basic-api" }

  SecretsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${ProjectName}-${Environment}-kms-secrets"
      TargetKeyId: !Ref SecretsKey

  # ---------------------------------------------------------------------------
  # Secrets
  #
  # Every value here is generated by CloudFormation or by RDS. No secret is ever
  # passed in as a parameter, printed, or read back, so none of them pass through
  # a shell history, a terminal, or an agent transcript.
  # ---------------------------------------------------------------------------

  JwtSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${Environment}/jwt"
      Description: HS256 signing secret for AssetIQ access tokens.
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        # JwtSecretValidator refuses to boot on a weak secret: it requires at
        # least 32 bytes and enough unique bytes to clear an entropy floor. 64
        # generated characters clears both with margin.
        PasswordLength: 64
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  PaystackSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}/${Environment}/paystack"
      Description: >
        Paystack secret key. Generated as a placeholder so the application can
        start. StartupSecurityValidator refuses to boot when this is blank, so it
        cannot simply be omitted. Replace the value out of band before exercising
        any billing flow.
      KmsKeyId: !Ref SecretsKey
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secretKey"
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: Placeholder, Value: "true" }

  # ---------------------------------------------------------------------------
  # Container registry
  # ---------------------------------------------------------------------------

  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${ProjectName}-${Environment}-ecr-backend"
      ImageScanningConfiguration:
        # The CI pipeline has no image scanning yet, so this is currently the only
        # thing looking at the image for known CVEs.
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the last 10 images; untagged layers are pure cost.",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  AppStorageBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-s3-appdata-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        # Generated reports and imports are recreatable, but versioning is the
        # difference between an accidental delete being an inconvenience and being
        # data loss.
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${Environment}-s3-web-${AWS::AccountId}"
      # Stays fully private. CloudFront reaches it through Origin Access Control,
      # so there is no public bucket and no website endpoint to find directly.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  # ---------------------------------------------------------------------------
  # Network boundaries
  # ---------------------------------------------------------------------------

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AssetIQ application instance. Ingress only from CloudFront.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # Scoped to the AWS managed prefix list of CloudFront origin-facing ranges
        # rather than 0.0.0.0/0. The instance serves plain HTTP, so leaving it open
        # would expose the API directly, unencrypted, and let anyone bypass the CDN.
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
          Description: HTTP from CloudFront edge locations only.
      # No inbound SSH. Shell access is via SSM Session Manager, which needs no
      # open port, no key pair, and leaves a CloudTrail record of every session.
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-sg-app" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AssetIQ Postgres. Reachable only from the application instance.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: Postgres from the application security group only.
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-sg-db" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for the AssetIQ staging database.
      SubnetIds: !Ref SubnetIds
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  Database:
    Type: AWS::RDS::DBInstance
    # Snapshot on delete. The whole point of choosing RDS over a container was that
    # losing the instance must not mean losing the data.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-${Environment}-rds-main"
      DBName: assetiq
      Engine: postgres
      EngineVersion: !FindInMap [EngineVersions, Postgres, Version]
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref SecretsKey
      MasterUsername: assetiq_admin
      # RDS creates the password, stores it in Secrets Manager and rotates it on a
      # schedule it manages. The value is never chosen, transmitted, or seen by a
      # human or an agent, which is strictly better than generating one here and
      # passing it around as a parameter.
      ManageMasterUserPassword: true
      MasterUserSecret:
        KmsKeyId: !Ref SecretsKey
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      MultiAZ: false  # Single AZ is a deliberate staging cost trade off.
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      PreferredBackupWindow: "02:00-03:00"
      PreferredMaintenanceWindow: "sun:03:30-sun:04:30"
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: false  # Not free on t4g.micro.
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-${Environment}-rds-main" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Team, Value: !Ref Team }
        - { Key: ManagedBy, Value: cloudformation }
        - { Key: CostCenter, Value: !Ref CostCenter }

  # ---------------------------------------------------------------------------
  # Application identity
  # ---------------------------------------------------------------------------

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-role-app"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager shell access, which is what replaces an open SSH port.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-own-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Scoped to exactly three secret ARNs. The instance fetches these at
              # boot under its own identity; no secret is ever baked into user data,
              # an image, or an environment file on disk.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref JwtSecret
                  - !Ref PaystackSecret
                  - !GetAtt Database.MasterUserSecret.SecretArn
                Condition:
                  Bool: { "aws:SecureTransport": "true" }
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !GetAtt SecretsKey.Arn
                Condition:
                  Bool: { "aws:SecureTransport": "true" }
        - PolicyName: app-storage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${AppStorageBucket.Arn}/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AppStorageBucket.Arn
        - PolicyName: pull-backend-image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"  # This action does not support resource scoping.
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !GetAtt BackendRepository.Arn
      Tags:
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ManagedBy, Value: cloudformation }

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-instanceprofile-app"
      Roles: [!Ref AppRole]

Outputs:
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-DatabaseEndpoint" }
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export: { Name: !Sub "${AWS::StackName}-DatabaseSecretArn" }
  JwtSecretArn:
    Value: !Ref JwtSecret
    Export: { Name: !Sub "${AWS::StackName}-JwtSecretArn" }
  PaystackSecretArn:
    Value: !Ref PaystackSecret
    Export: { Name: !Sub "${AWS::StackName}-PaystackSecretArn" }
  BackendRepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-BackendRepositoryUri" }
  AppStorageBucketName:
    Value: !Ref AppStorageBucket
    Export: { Name: !Sub "${AWS::StackName}-AppStorageBucketName" }
  WebBucketName:
    Value: !Ref WebBucket
    Export: { Name: !Sub "${AWS::StackName}-WebBucketName" }
  WebBucketRegionalDomainName:
    Value: !GetAtt WebBucket.RegionalDomainName
    Export: { Name: !Sub "${AWS::StackName}-WebBucketRegionalDomainName" }
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
    Export: { Name: !Sub "${AWS::StackName}-AppSecurityGroupId" }
  AppInstanceProfileName:
    Value: !Ref AppInstanceProfile
    Export: { Name: !Sub "${AWS::StackName}-AppInstanceProfileName" }
  SecretsKeyArn:
    Value: !GetAtt SecretsKey.Arn
    Export: { Name: !Sub "${AWS::StackName}-SecretsKeyArn" }
